        <div style="max-width:800px; margin: 0 auto; text-align:left;
                    max-height:430px; overflow-y:auto; padding-right:10px;">

        <p><strong>Instrucciones</strong></p>

        <p>
            Este test consta de varias pruebas. En cada una de ellas verás una 
            <strong>secuencia de letras en español</strong>.
        </p>

        <p>
            Tu tarea es decidir si se trata de una <strong>palabra real del español que conoces</strong>.
            Si piensas que <strong>sí es una palabra del español</strong> que conoces, haz clic en 
            el botón <strong>“sí”</strong>. Si piensas que <strong>no es una palabra del español</strong> 
            o no estás seguro, haz clic en <strong>“no”</strong>.
        </p>

        <p>
            Si estás seguro de que la palabra existe, aunque no sepas exactamente lo que significa, 
            puedes responder <strong>“sí”</strong>. Pero si no estás seguro de que sea una palabra 
            existente, debes responder <strong>“no”</strong>.
        </p>

        <p>
            <strong>Importante:</strong> los errores se penalizan. No tiene sentido marcar “sí” 
            para muchas palabras que no conoces solo para intentar subir la puntuación.
        </p>

        <p>
            No hay límite de tiempo estricto, pero responde de forma rápida y segura. 
            Esta parte del experimento suele durar unos pocos minutos.
        </p>

        <p>
            Si todo está claro, puedes pulsar <strong>“Comenzar”</strong> para iniciar el test.
        </p>
        </div>
    `,
    choices: ['Comenzar']
    };

    timeline.push(lextale_instructions);

    var lextale_trial = {
    type: jsPsychHtmlButtonResponse,
    stimulus: function() {
        var w = jsPsych.timelineVariable('item');
        return '<p style="font-size:40px; font-style:italic; margin-top:60px;">'
                + w +
            '</p>';
    },
    choices: ['no', 'sí'],
    button_html: [
        '<button class="jspsych-btn" ' +
        'style="background-color:red; color:white; font-size:22px; ' +
        'padding:10px 40px; margin: 40px 20px; border:2px solid black;">%choice%</button>',
        '<button class="jspsych-btn" ' +
        'style="background-color:green; color:white; font-size:22px; ' +
        'padding:10px 40px; margin: 40px 20px; border:2px solid black;">%choice%</button>'
    ],

    data: {
        task: 'lextale',
        item: jsPsych.timelineVariable('item'),
        is_word: jsPsych.timelineVariable('is_word')
    },

    on_finish: function(data){
        data.response_label = data.response === 1 ? "sí" : "no";
    }
    };

    var lextale_procedure = {
    timeline: [lextale_trial],
    timeline_variables: lextale_items,
    randomize_order: false  
    };

    timeline.push(lextale_procedure);

    
    
    const save_data = {
        type: jsPsychPipe,
        action: "save",
        experiment_id: "qLqX2Ri5COwC",
        filename: `${subject_id}.csv`,
        data_string: ()=>jsPsych.data.get().csv()
    };

    timeline.push(save_data);

    var end_exp = {
        type: jsPsychHtmlButtonResponse,
        stimulus: `
            <div style="
                max-width:800px; 
                margin:0 auto; 
                text-align:center; 
                padding:40px 20px; 
                border-radius:16px; 
                border:3px solid #2e7d32; 
                background-color:#e8f5e9;
            ">
                <div style="font-size:60px; margin-bottom:20px;">✅</div>
                
                <p style="font-size:34px; font-weight:bold; color:#1b5e20; margin-bottom:10px;">
                    ¡HAS TERMINADO LA PRUEBA!
                </p>
                
                <p style="font-size:20px; margin-bottom:20px;">
                    Tus respuestas se han <strong>guardado correctamente</strong>.
                </p>

                <p style="font-size:18px; margin-bottom:10px;">
                    Cualquier duda o aclaración, puedes comunicarte con el 
                    <strong>Dr. Julio Llamas Alonso</strong> al correo:
                    <br>
                    <strong>julio_llamas@uaeh.edu.mx</strong>
                </p>

                <p style="font-size:22px; font-weight:bold; color:#b71c1c; margin-top:30px;">
                    Ya no hay más preguntas.
                    <br>
                    Ahora puedes <span style="text-decoration:underline;">cerrar esta pestaña del navegador</span>.
                </p>
            </div>
        `,
        choices: ['Finalizar actividad'],
        data: { stimulus: "Ending" },
        on_load: function() {
            // Barra de progreso al 100% para que se note que acabó
            jsPsych.setProgressBar(1);
        },
        on_finish: function() {
            // Permitir salir sin mensaje
            allowUnload = true;
            window.removeEventListener('beforeunload', handleBeforeUnload);
        }
    };


    timeline.push(end_exp);
    
    timeline.push({
        type: jsPsychFullscreen,
        fullscreen_mode: false
    });

    jsPsych.run(timeline);


</script>
